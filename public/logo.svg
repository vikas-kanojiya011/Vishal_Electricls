<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="60%" stop-color="#13243F" />
      <stop offset="100%" stop-color="#060E18" />
    </linearGradient>

    <!-- Bevel Border Gradient: Cyan to Amber Gold -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Vibrant Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Text Gold Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ── 1. Shield & 'V' Electrical Emblem ── -->
  <g transform="translate(6, 6)" filter="url(#logoShadow)">
    <!-- Outer Shield Frame -->
    <path
      d="M26 2 L48 11 V28 C48 40 38.5 48 26 51 C13.5 48 4 40 4 28 V11 L26 2 Z"
      fill="url(#shieldGrad)"
      stroke="url(#borderGrad)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Inner Safety Contour -->
    <path
      d="M26 6 L43 13.5 V27 C43 36.5 35 43.5 26 46 C17 43.5 9 36.5 9 27 V13.5 L26 6 Z"
      fill="none"
      stroke="#38BDF8"
      stroke-width="1"
      stroke-dasharray="2 3"
      opacity="0.4"
    />

    <!-- Stylized Monogram 'V' Left Arm -->
    <path
      d="M13 16 L22 36 H17 L10 20 Z"
      fill="#38BDF8"
      opacity="0.85"
    />

    <!-- Central High-Voltage Lightning Bolt -->
    <path
      d="M29 9 L17 26 H26 L22 43 L37 24 H28 L32 9 Z"
      fill="url(#boltGrad)"
      stroke="#FFFBEB"
      stroke-width="0.75"
    />

    <!-- Voltage Spark Node -->
    <circle cx="32" cy="9" r="1.5" fill="#FFFFFF" />
    <circle cx="22" cy="43" r="1.2" fill="#FBBF24" />
  </g>

  <!-- ── 2. Brand Typography ── -->
  <g transform="translate(68, 12)">
    <!-- Primary Name: VISHAL -->
    <text
      x="0"
      y="24"
      font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="24"
      font-weight="800"
      fill="#FFFFFF"
      letter-spacing="-0.02em"
    >
      VISHAL
    </text>

    <!-- Primary Name: ELECTRICALS -->
    <text
      x="96"
      y="24"
      font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="24"
      font-weight="800"
      fill="url(#goldText)"
      letter-spacing="-0.02em"
    >
      ELECTRICALS
    </text>

    <!-- Govt. Certification Subtitle & Live Status -->
    <circle cx="4" cy="38" r="3" fill="#10B981" />
    <circle cx="4" cy="38" r="5" stroke="#10B981" stroke-width="1" opacity="0.4" />
    <text
      x="14"
      y="41"
      font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="9"
      font-weight="700"
      fill="#94A3B8"
      letter-spacing="0.08em"
    >
      GOVT. LICENSED WIREMEN · MUMBAI
    </text>
  </g>
</svg>
